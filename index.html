<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accountability Matrix</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="app-header">
  <div class="app-header-title">
    <h1>Accountability Matrix</h1>
    <p id="sheet-name" class="app-header-subtitle">Loading matrix&hellip;</p>
  </div>
  <div class="app-header-meta">
    <span id="generated-at"></span>
    <button id="print-btn" type="button" class="text-button no-print">Print / Export PDF</button>
  </div>
</header>

<div class="toolbar no-print">
  <div class="toolbar-group">
    <input id="search" type="search" placeholder="Search tasks or people&hellip;" />
    <select id="status-filter">
      <option value="">All statuses</option>
    </select>
    <select id="category-filter">
      <option value="">All categories</option>
    </select>
    <label class="checkbox-label">
      <input id="hide-completed" type="checkbox" />
      Hide completed
    </label>
  </div>
</div>

<div class="legend">
  <span class="legend-item"><span class="swatch swatch-complete"></span>Complete</span>
  <span class="legend-item"><span class="swatch swatch-in-progress"></span>In Progress</span>
  <span class="legend-item"><span class="swatch swatch-blocked"></span>Blocked</span>
  <span class="legend-item"><span class="swatch swatch-not-started"></span>Not Started</span>
  <span class="legend-item"><span class="role-dot role-dot-r"></span>Responsible</span>
  <span class="legend-item"><span class="role-dot role-dot-a"></span>Accountable</span>
  <span class="legend-item"><span class="role-dot role-dot-c"></span>Consulted</span>
  <span class="legend-item"><span class="role-dot role-dot-i"></span>Informed</span>
</div>

<section class="availability-panel no-print">
  <div class="availability-header">
    <h2>By Person</h2>
    <button id="by-person-toggle" type="button" class="text-button panel-toggle" aria-expanded="false">Show</button>
  </div>
  <div id="by-person-body" class="availability-body collapsed">
    <div class="availability-controls">
      <label class="availability-select-label">
        Person
        <select id="person-select">
          <option value="">Select a person&hellip;</option>
        </select>
      </label>
    </div>
    <div id="by-person-results" class="availability-results">
      <p class="status-message">Pick a person to see their responsibilities across the matrix.</p>
    </div>
  </div>
</section>

<main id="matrix-root" class="matrix-root">
  <p class="status-message" id="status-message">Loading matrix data&hellip;</p>
</main>

<footer class="app-footer no-print">
  <p>Data source: Smartsheet, synced via GitHub Actions. See <a href="README.md">README</a> for setup.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
